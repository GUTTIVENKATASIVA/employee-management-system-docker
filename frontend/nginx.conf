server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's embedded DNS; lets nginx re-resolve `backend` if its IP changes.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy every /api request to the Flask container (service name `backend`).
    # With a variable and no URI part, the original request URI is passed as-is.
    location /api/ {
        set $flask_upstream http://backend:5000;
        proxy_pass $flask_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
