name: employee-management-system

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-employee_db}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql                                # persistent data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro  # schema + sample rows (first start only)
    healthcheck:
      # Pings over TCP; the temporary bootstrap server only listens on a socket,
      # so this turns healthy only once MySQL is fully initialised.
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - app-net
    # No `ports:` -> MySQL is reachable only from other containers as host `db`.

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-employee_db}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    expose:
      - "5000"          # internal only; not published to the host
    networks:
      - app-net

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"   # the only published port
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]   # proves nginx -> Flask -> MySQL
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-net

volumes:
  mysql_data:

networks:
  app-net:
    driver: bridge
